[project]
name = "regression-pipeline"
version = "0.1.0"
description = "A tabular regression pipeline that works on any CSV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.26.0",
    "ipykernel>=6.29.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.61.1",
]

[tool.uv]
package = false
